<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Delivery Portal — NM Auctions</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #f0f9ff;
    min-height: 100vh;
    color: #1e293b;
  }

  .header {
    background: linear-gradient(135deg, #0369a1 0%, #0ea5e9 100%);
    color: #fff;
    padding: 20px 20px 16px;
    text-align: center;
  }
  .header h1 { font-size: 22px; font-weight: 800; letter-spacing: -0.3px; }
  .header p  { font-size: 13px; opacity: 0.85; margin-top: 4px; }

  .container { max-width: 560px; margin: 0 auto; padding: 20px 16px 60px; }

  /* LOGIN CARD */
  .login-card {
    background: #fff;
    border-radius: 20px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.10);
    padding: 32px 24px;
    margin-top: 24px;
    text-align: center;
  }
  .login-card .icon { font-size: 48px; margin-bottom: 12px; }
  .login-card h2 { font-size: 20px; font-weight: 800; margin-bottom: 6px; }
  .login-card p  { font-size: 13px; color: #64748b; margin-bottom: 20px; }

  .code-input {
    display: block;
    width: 100%;
    padding: 14px 16px;
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 3px;
    text-align: center;
    text-transform: uppercase;
    border: 2px solid #e2e8f0;
    border-radius: 14px;
    outline: none;
    transition: border-color 0.2s;
    margin-bottom: 14px;
  }
  .code-input:focus { border-color: #0ea5e9; }
  .code-input.invalid { border-color: #ef4444; animation: shake 0.3s ease; }

  @keyframes shake {
    0%,100% { transform: translateX(0); }
    25%      { transform: translateX(-6px); }
    75%      { transform: translateX(6px); }
  }

  .btn-primary {
    width: 100%;
    padding: 14px;
    background: linear-gradient(135deg, #0369a1, #0ea5e9);
    color: #fff;
    font-size: 15px;
    font-weight: 700;
    border: none;
    border-radius: 14px;
    cursor: pointer;
    transition: opacity 0.2s;
  }
  .btn-primary:active { opacity: 0.85; }
  .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

  .error-msg {
    margin-top: 12px;
    font-size: 13px;
    color: #dc2626;
    font-weight: 600;
    display: none;
  }

  /* PORTAL */
  #portal { display: none; }

  .consigner-banner {
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.07);
    padding: 16px 18px;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .consigner-banner .avatar {
    width: 44px; height: 44px;
    background: linear-gradient(135deg, #0369a1, #0ea5e9);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; flex-shrink: 0;
  }
  .consigner-banner .info { flex: 1; min-width: 0; }
  .consigner-banner .name { font-size: 16px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .consigner-banner .sub  { font-size: 12px; color: #64748b; margin-top: 2px; }
  .logout-btn {
    background: none; border: 1.5px solid #e2e8f0; color: #64748b;
    font-size: 12px; font-weight: 700; padding: 6px 12px;
    border-radius: 8px; cursor: pointer; flex-shrink: 0;
  }

  .section-label {
    font-size: 11px; font-weight: 800; letter-spacing: 0.07em;
    text-transform: uppercase; color: #64748b;
    margin: 20px 0 10px;
  }

  .empty-state {
    text-align: center;
    padding: 48px 20px;
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.07);
  }
  .empty-state .big-icon { font-size: 48px; margin-bottom: 12px; }
  .empty-state h3 { font-size: 17px; font-weight: 700; margin-bottom: 6px; }
  .empty-state p  { font-size: 13px; color: #64748b; }

  .item-card {
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.07);
    margin-bottom: 12px;
    overflow: hidden;
    transition: box-shadow 0.2s;
  }
  .item-card.done {
    opacity: 0.5;
    pointer-events: none;
  }

  .item-card-inner {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 16px;
  }

  .item-thumb {
    width: 64px; height: 64px;
    border-radius: 10px;
    object-fit: cover;
    background: #f1f5f9;
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 28px;
    overflow: hidden;
  }
  .item-thumb img { width: 100%; height: 100%; object-fit: cover; }

  .item-info { flex: 1; min-width: 0; }
  .item-name { font-size: 15px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item-meta { font-size: 12px; color: #64748b; margin-top: 3px; }
  .item-lot  { font-size: 11px; font-weight: 700; color: #0ea5e9; margin-top: 2px; }

  .deliver-btn {
    background: linear-gradient(135deg, #059669, #10b981);
    color: #fff;
    font-size: 12px;
    font-weight: 700;
    border: none;
    border-radius: 10px;
    padding: 8px 12px;
    cursor: pointer;
    flex-shrink: 0;
    white-space: nowrap;
    transition: opacity 0.2s;
  }
  .deliver-btn:active { opacity: 0.8; }

  .done-badge {
    background: #d1fae5;
    color: #065f46;
    font-size: 12px;
    font-weight: 700;
    border-radius: 10px;
    padding: 8px 12px;
    flex-shrink: 0;
    white-space: nowrap;
  }

  .mark-all-bar {
    background: #fff;
    border-radius: 14px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.07);
    padding: 14px 16px;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .mark-all-bar span { font-size: 13px; font-weight: 700; color: #374151; }
  .btn-mark-all {
    background: linear-gradient(135deg, #059669, #10b981);
    color: #fff;
    font-size: 13px;
    font-weight: 700;
    border: none;
    border-radius: 10px;
    padding: 10px 18px;
    cursor: pointer;
    transition: opacity 0.2s;
  }
  .btn-mark-all:active { opacity: 0.8; }
  .btn-mark-all:disabled { opacity: 0.4; cursor: not-allowed; }

  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: #1e293b; color: #fff;
    font-size: 13px; font-weight: 600;
    padding: 12px 20px; border-radius: 12px;
    white-space: nowrap;
    opacity: 0; pointer-events: none;
    transition: opacity 0.25s;
    z-index: 9999;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>

<div class="header">
  <h1>🚚 Delivery Portal</h1>
  <p>NM Auctions — Driver Pickup Management</p>
</div>

<div class="container">

  <!-- LOGIN -->
  <div class="login-card" id="loginCard">
    <div class="icon">📦</div>
    <h2>Enter Consigner Code</h2>
    <p>Enter the consigner's code to view items ready for pickup and delivery to the studio.</p>
    <input class="code-input" id="codeInput" type="text" maxlength="20"
      placeholder="CODE" autocapitalize="characters" autocomplete="off"
      onkeydown="if(event.key==='Enter') lookup()">
    <button class="btn-primary" onclick="lookup()" id="lookupBtn">View Pickup Items</button>
    <div class="error-msg" id="errorMsg"></div>
  </div>

  <!-- PORTAL -->
  <div id="portal">
    <div class="consigner-banner">
      <div class="avatar">🏠</div>
      <div class="info">
        <div class="name" id="consignerName"></div>
        <div class="sub" id="consignerSub"></div>
      </div>
      <button class="logout-btn" onclick="logout()">Change</button>
    </div>

    <div id="pendingSection">
      <div class="mark-all-bar" id="markAllBar" style="display:none;">
        <span id="pendingCount"></span>
        <button class="btn-mark-all" id="markAllBtn" onclick="markAllDelivered()">✓ Mark All Received</button>
      </div>
      <div class="section-label">Items to Pick Up</div>
      <div id="itemList"></div>
    </div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
  var currentCode = '';
  var items = [];
  var driverName = 'Driver';

  var codeInput = document.getElementById('codeInput');
  var loginCard  = document.getElementById('loginCard');
  var portal     = document.getElementById('portal');
  var errorMsg   = document.getElementById('errorMsg');
  var lookupBtn  = document.getElementById('lookupBtn');

  function showError(msg) {
    errorMsg.textContent = msg;
    errorMsg.style.display = 'block';
    codeInput.classList.add('invalid');
    setTimeout(function() { codeInput.classList.remove('invalid'); }, 400);
  }

  function hideError() {
    errorMsg.style.display = 'none';
  }

  async function lookup() {
    var code = codeInput.value.trim().toUpperCase();
    if (!code) { showError('Please enter a consigner code.'); return; }

    hideError();
    lookupBtn.disabled = true;
    lookupBtn.textContent = 'Looking up…';

    try {
      var res = await fetch('/delivery/' + encodeURIComponent(code));
      var data = await res.json();

      if (!data.success) {
        showError(data.message || 'Consigner code not found.');
        return;
      }

      currentCode = code;
      items = data.items || [];
      renderPortal(data.consigner, code, items);
    } catch (e) {
      showError('Network error. Please try again.');
    } finally {
      lookupBtn.disabled = false;
      lookupBtn.textContent = 'View Pickup Items';
    }
  }

  function renderPortal(consigner, code, itemList) {
    document.getElementById('consignerName').textContent = consigner || code;
    document.getElementById('consignerSub').textContent = 'Code: ' + code + '  ·  ' + itemList.length + ' item(s) pending';

    loginCard.style.display = 'none';
    portal.style.display = 'block';

    renderItems(itemList);
  }

  function renderItems(itemList) {
    var list = document.getElementById('itemList');
    var markAllBar = document.getElementById('markAllBar');
    var pendingCount = document.getElementById('pendingCount');

    var pending = itemList.filter(function(i) { return !i._done; });

    if (pending.length > 0) {
      markAllBar.style.display = 'flex';
      pendingCount.textContent = pending.length + ' item' + (pending.length !== 1 ? 's' : '') + ' to deliver';
    } else {
      markAllBar.style.display = 'none';
    }

    if (itemList.length === 0) {
      list.innerHTML = '<div class="empty-state"><div class="big-icon">✅</div><h3>No Items Pending</h3><p>There are no items awaiting delivery for this consigner right now.</p></div>';
      return;
    }

    list.innerHTML = itemList.map(function(item, idx) {
      var thumb = item.photo
        ? '<img src="' + escHtml(item.photo) + '" alt="" onerror="this.style.display=\'none\'">'
        : getCategoryIcon(item.category);

      var meta = [item.category || '', item.condition || ''].filter(Boolean).join(' · ');
      var lot  = item.lotNumber ? 'Lot #' + item.lotNumber : '';

      var actionBtn = item._done
        ? '<span class="done-badge">✓ Delivered</span>'
        : '<button class="deliver-btn" onclick="markDelivered(' + idx + ', this)">✓ Mark Received</button>';

      return '<div class="item-card' + (item._done ? ' done' : '') + '" id="icard-' + idx + '">' +
        '<div class="item-card-inner">' +
          '<div class="item-thumb">' + thumb + '</div>' +
          '<div class="item-info">' +
            '<div class="item-name">' + escHtml(item.name || 'Unnamed Item') + '</div>' +
            (meta ? '<div class="item-meta">' + escHtml(meta) + '</div>' : '') +
            (lot  ? '<div class="item-lot">' + escHtml(lot) + '</div>' : '') +
          '</div>' +
          actionBtn +
        '</div>' +
      '</div>';
    }).join('');
  }

  async function markDelivered(idx, btn) {
    var item = items[idx];
    if (!item || item._done) return;

    btn.disabled = true;
    btn.textContent = '…';

    try {
      var res = await fetch('/items/' + item.id + '/deliver', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ driver: driverName })
      });
      var data = await res.json();
      if (!data.success) throw new Error(data.message || 'Error');

      items[idx]._done = true;
      renderItems(items);
      showToast('✓ ' + (item.name || 'Item') + ' marked received');

      // If all done, show celebration
      if (items.every(function(i) { return i._done; })) {
        setTimeout(showAllDone, 500);
      }
    } catch (e) {
      btn.disabled = false;
      btn.textContent = '✓ Mark Received';
      showToast('Error: ' + e.message);
    }
  }

  async function markAllDelivered() {
    var pending = items.filter(function(i) { return !i._done; });
    if (!pending.length) return;

    var btn = document.getElementById('markAllBtn');
    btn.disabled = true;
    btn.textContent = 'Marking…';

    var errors = 0;
    for (var i = 0; i < items.length; i++) {
      if (items[i]._done) continue;
      try {
        var res = await fetch('/items/' + items[i].id + '/deliver', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ driver: driverName })
        });
        var data = await res.json();
        if (data.success) items[i]._done = true;
        else errors++;
      } catch (e) { errors++; }
    }

    renderItems(items);
    if (errors) {
      showToast(errors + ' item(s) could not be marked — try individually');
    } else {
      showToast('All items marked as received!');
      setTimeout(showAllDone, 500);
    }
  }

  function showAllDone() {
    document.getElementById('itemList').innerHTML =
      '<div class="empty-state"><div class="big-icon">🎉</div><h3>All Done!</h3><p>All items have been received at the studio. Great work!</p></div>';
    document.getElementById('markAllBar').style.display = 'none';
  }

  function logout() {
    currentCode = '';
    items = [];
    codeInput.value = '';
    hideError();
    portal.style.display = 'none';
    loginCard.style.display = 'block';
  }

  function getCategoryIcon(cat) {
    var icons = { furniture:'🪑', decor:'🏺', tools:'🔧', art:'🎨', electronics:'📺',
      glassware:'🥂', kitchenware:'🍳', books:'📚', jewelry:'💎', outdoor:'🌿',
      collectibles:'🏆', clothing:'👗', toys:'🧸', misc:'📦' };
    return icons[(cat || '').toLowerCase()] || '📦';
  }

  function escHtml(s) {
    return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  var toastTimer;
  function showToast(msg) {
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function() { t.classList.remove('show'); }, 2800);
  }
</script>
</body>
</html>
